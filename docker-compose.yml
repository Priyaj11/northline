services:
  parabank:
    image: parasoft/parabank:latest
    container_name: northline-parabank
    ports:
      - "8080:8080"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/parabank/index.htm > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  warehouse:
    image: postgres:16
    container_name: northline-warehouse
    environment:
      POSTGRES_DB: ${PGDATABASE:-northline}
      POSTGRES_USER: ${PGUSER:-northline}
      POSTGRES_PASSWORD: ${PGPASSWORD:-northline}
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - northline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-northline} -d ${PGDATABASE:-northline}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  northline_pgdata:
