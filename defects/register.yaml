# Northline defect register.
#
# The narrative writeups live in defects/DEF-NNN.md. This file is the
# machine-readable index of them, and it is what the certification engine in
# Phase 7 reads: GATE-CRITICAL-DEFECT fails a release on any open defect of
# severity Critical or High.
#
# The register is the source of truth for the release decision, NOT the test
# results. A known defect marked xfail in the suite still appears here as open,
# so marking a test does not quietly make a defect disappear from the gate.
#
# severity  technical impact: how badly is the system broken
# priority  business urgency: how soon must it be fixed
# They vary independently. See docs/test-strategy.md.

release: R1.0
system_under_test: ParaBank

defects:

  - id: DEF-001
    title: Transfer amounts are not validated, and negative amounts move money in reverse
    severity: Critical
    priority: P1
    status: Open
    requirements: [REQ-XFER-003]
    test_cases: [TC-XFER-004, TC-XFER-005, TC-XFER-007, TC-SEC-008]
    detected_in_phase: 3
    detected_on: 2026-08-30
    detection_method: designed test case
    detection_layer: api
    reproducibility: consistent
    document: DEF-001.md

  - id: DEF-002
    title: The transfer endpoint declares JSON and returns plain text
    severity: Medium
    priority: P3
    status: Open
    requirements: [REQ-TXN-003]
    test_cases: []
    detected_in_phase: 3
    detected_on: 2026-08-29
    detection_method: exploratory
    detection_layer: api
    reproducibility: consistent
    document: DEF-002.md
    note: >
      Found while discovering the API response shapes, not by a planned test
      case. Recorded as exploratory rather than attributed to a test case that
      did not exist at the time. A register that credits every defect to a
      designed case overstates how much the test design found.

