  - id: DEF-005
    title: The REST services require no authentication
    severity: Critical
    priority: P1
    status: Open
    requirements: [REQ-SEC-001, REQ-SEC-002]
    test_cases: [TC-SEC-001, TC-SEC-002, TC-SEC-003]
    detected_in_phase: 5
    detected_on: 2026-08-31
    detection_method: designed test case
    detection_layer: security
    reproducibility: consistent
    document: DEF-005.md
    note: >
      First observed during Phase 1 endpoint discovery and recorded as an
      observation for four phases before being tested and raised. Recording it
      as detected in Phase 5 is the honest entry: an observation is not a
      defect until it has been tested against a requirement.

