release: R1.0
system_under_test: ParaBank
executed_by: 'QA engineer acting as proxy for a business user. This is NOT business acceptance
  testing in the strict sense, and the distinction is recorded rather than glossed over: acceptance
  testing answers "is this the right thing", which only somebody who owns the business outcome
  can answer. A single-engineer project has no such person.

  What these scenarios do provide is the other half of acceptance testing: end-to-end journeys
  written in business language, executed by hand through the interface a customer uses, judged
  against outcomes a customer would recognise rather than against technical assertions.

  '
scenarios:
- id: UAT-01
  title: A new customer can join the bank and start using it
  persona: Someone who has just been given access to online banking
  requirements:
  - REQ-AUTH-005
  - REQ-AUTH-001
  - REQ-ACCT-001
  business_outcome: 'A person can register, is immediately able to see their money, and can
    come back later and get in again.

    '
  steps:
  - Open the bank's home page.
  - Choose to register, and complete the form with your own details.
  - Confirm you can see an account and a balance.
  - Log out, then log back in with the username and password you chose.
  acceptance:
  - You are signed in immediately after registering, without a second step.
  - At least one account is visible with a balance.
  - The same credentials work again after logging out.
  status: covered by automation
  covered_by:
  - tests/ui/test_registration_ui.py::test_a_new_customer_can_register_and_is_signed_in
  - tests/ui/test_registration_ui.py::test_a_registered_customer_can_log_back_in
- id: UAT-02
  title: A customer can see where their money is
  persona: Someone checking their balances before paying for something
  requirements:
  - REQ-ACCT-001
  - REQ-ACCT-002
  - REQ-TXN-001
  business_outcome: 'A customer can find out how much money they have and what has been happening
    in an account, without help.

    '
  steps:
  - Log in as the demo customer.
  - Look at the list of accounts and note one balance.
  - Open that account.
  - Read its recent transactions.
  acceptance:
  - Every account the customer holds appears in the list.
  - The balance on the account page matches the one in the list.
  - Transactions show a date, a description and an amount.
  - It is clear which transactions took money out and which put it in.
  status: covered by automation
  covered_by:
  - tests/ui/test_accounts_ui.py::test_the_overview_lists_the_customers_accounts
  - tests/ui/test_accounts_ui.py::test_every_displayed_balance_matches_the_service
  - tests/ui/test_billpay_ui.py::test_the_account_activity_lists_transactions
- id: UAT-03
  title: A customer can move money between their own accounts
  persona: Someone covering a bill from savings
  requirements:
  - REQ-XFER-001
  - REQ-XFER-002
  - REQ-XFER-006
  business_outcome: 'Money moves where the customer intended, the amount is right, and they
    can see afterwards that it happened.

    '
  steps:
  - Note the balances of two of your accounts.
  - Transfer 100.00 from the first to the second.
  - Read the confirmation.
  - Return to the account list and check both balances.
  - Open each account and find the transaction.
  acceptance:
  - The confirmation names the amount and both accounts.
  - The first balance is exactly 100.00 lower.
  - The second is exactly 100.00 higher.
  - The transfer appears in both accounts' history.
  status: covered by automation
  covered_by:
  - tests/ui/test_transfer_ui.py::test_a_valid_transfer_shows_a_confirmation
  - tests/ui/test_transfer_ui.py::test_a_transfer_through_the_browser_moves_exactly_the_amount
  - tests/database/test_transaction_correctness.py::test_a_transfer_writes_one_transaction_to_each_account
- id: UAT-04
  title: A customer can pay a bill
  persona: Someone paying a utility bill from their current account
  requirements:
  - REQ-BILL-001
  - REQ-BILL-003
  business_outcome: 'A payment leaves the account for the right amount and the customer can
    see a record of it afterwards.

    '
  steps:
  - Note the balance of the account you will pay from.
  - Complete a bill payment for 25.00 to any payee.
  - Read the confirmation.
  - Check the balance and the account's transactions.
  acceptance:
  - The confirmation names the payee, the amount and the account.
  - The balance is exactly 25.00 lower.
  - The payment appears in the account's transaction list.
  status: covered by automation
  covered_by:
  - tests/ui/test_billpay_ui.py::test_a_bill_payment_through_the_browser_is_confirmed
  - tests/ui/test_billpay_ui.py::test_a_bill_payment_through_the_browser_debits_the_account
  - tests/ui/test_billpay_ui.py::test_a_bill_payment_appears_in_the_account_activity
- id: UAT-05
  title: A customer is told when they have made a mistake
  persona: Someone who mistypes an amount
  requirements:
  - REQ-XFER-004
  - REQ-BILL-002
  business_outcome: 'When a customer enters something the bank cannot accept, they are told
    clearly enough to fix it themselves.

    '
  steps:
  - Start a transfer and type letters into the amount.
  - Submit it and read what the page says.
  - Try again leaving the amount empty.
  - Start a bill payment and leave the payee name empty, then submit.
  acceptance:
  - Each attempt produces a message, not silence.
  - The message says what is wrong in words a customer would understand.
  - No money moves in any of these attempts.
  status: designed, not executed
  covered_by:
  - tests/ui/test_transfer_ui.py and tests/api/test_transfer_validation_api.py confirm that
    invalid amounts are refused and move no money
  note: 'Partially covered: automation confirms invalid amounts are refused and that no money
    moves. What is NOT covered, and what this scenario exists for, is whether the wording
    is intelligible to a customer and whether it is clear which field each message concerns.
    That is a human judgement and it has not been made. Related evidence does exist from another
    direction: TC-ACC-007 established that the error text is present and readable but is not
    programmatically associated with the field, recorded in DEF-003.'
- id: UAT-06
  title: A customer can leave safely on a shared computer
  persona: Someone using online banking on a library machine
  requirements:
  - REQ-AUTH-004
  - REQ-SEC-004
  business_outcome: 'After logging out, the next person at that computer cannot see the previous
    customer''s money.

    '
  steps:
  - Log in and open the account overview.
  - Copy the page address from the browser.
  - Log out.
  - Paste the address back in and press enter.
  - Press the browser's back button several times.
  acceptance:
  - Logging out returns you to the login page.
  - Pasting the address back shows no account information.
  - Going back in history shows no account information.
  status: designed, not executed
  covered_by:
  - tests/security/test_session_ui.py::test_the_session_ends_when_the_customer_logs_out
  - tests/security/test_session_ui.py::test_a_protected_page_returns_no_customer_data_without_a_session
  note: 'Partially covered: automation confirms that logging out ends access and that a protected
    page returns no data without a session. What is NOT covered is the browser BACK BUTTON
    after logout. Browsers cache pages aggressively, and no test in this project exercises
    history navigation. That gap is real and is stated rather than implied to be covered.'
