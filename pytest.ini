[pytest]
pythonpath = .
testpaths = tests
addopts =
    -ra
    --strict-markers
    --tb=short
    --junitxml=reports/junit.xml
markers =
    smoke: minimal checks that decide whether the environment is fit to test
    ui: Playwright browser tests
    api: HTTP API tests
    database: SQL and data validation tests
    reconciliation: settlement file reconciliation tests
    accessibility: axe-core and WCAG checks
    security: security-adjacent behaviour checks
    regression: full regression suite
